services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_DATABASE: gestao_artesanal
      DB_USERNAME: gestao
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      ALLOW_REGISTRATION: "0"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-0}
    volumes:
      - workshop_images:/var/www/app/public/uploads/workshops
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: gestao_artesanal
      MARIADB_USER: gestao
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  database:
  workshop_images:
