<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
ServerTokens Prod
ServerSignature Off
